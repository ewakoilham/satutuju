<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3958b3" />
    <title>Offline — Satu Tuju</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f4f7fc;
        color: #1c2540;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #fff;
        border: 1px solid #dbe4f3;
        border-radius: 20px;
        padding: 40px 28px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(57, 88, 179, 0.08);
      }
      img { width: 132px; height: auto; margin: 0 auto 20px; display: block; }
      h1 { font-size: 20px; margin: 0 0 8px; font-weight: 800; }
      p { font-size: 14px; line-height: 1.6; color: #5a6683; margin: 0 0 22px; }
      button {
        appearance: none;
        border: 0;
        background: #3958b3;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 22px;
        border-radius: 12px;
        cursor: pointer;
      }
      button:hover { background: #2e4a9a; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo-main.png" alt="Satu Tuju" />
      <h1>Kamu sedang offline</h1>
      <p>
        Sepertinya koneksi internetmu terputus. Periksa jaringanmu, lalu coba
        muat ulang halaman ini.
      </p>
      <button onclick="location.reload()">Coba lagi</button>
    </div>
  </body>
</html>
